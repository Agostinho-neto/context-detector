name: Cloud Run CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: Ação que será executada na Google Cloud
        required: true
        type: choice
        options:
          - deploy
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: context-detector-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_image_tag: ${{ github.sha }}
  IMAGE_URL: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/context-detector/context-detector:${{ github.sha }}

jobs:
  infrastructure:
    name: ${{ inputs.action }} Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify authentication
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud auth list --filter=status:ACTIVE

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Initialize Terraform
        working-directory: infra
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=context-detector/terraform"

      - name: Validate Terraform
        working-directory: infra
        run: terraform validate

      - name: Prepare Artifact Registry
        if: inputs.action == 'deploy'
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -target="google_project_service.required" \
            -target="google_artifact_registry_repository.context_detector"

      - name: Configure Docker authentication
        if: inputs.action == 'deploy'
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        if: inputs.action == 'deploy'
        run: docker build --tag "$IMAGE_URL" .

      - name: Push Docker image
        if: inputs.action == 'deploy'
        run: docker push "$IMAGE_URL"

      - name: Plan deployment
        if: inputs.action == 'deploy'
        working-directory: infra
        run: terraform plan -out=deploy.tfplan

      - name: Apply deployment
        if: inputs.action == 'deploy'
        working-directory: infra
        run: terraform apply deploy.tfplan

      - name: Show Cloud Run URL
        if: inputs.action == 'deploy'
        working-directory: infra
        run: terraform output -raw cloud_run_url

      - name: Plan destruction
        if: inputs.action == 'destroy'
        working-directory: infra
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Apply destruction
        if: inputs.action == 'destroy'
        working-directory: infra
        run: terraform apply destroy.tfplan